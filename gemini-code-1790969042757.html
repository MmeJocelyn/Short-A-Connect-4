<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connect Four - UFLI Lesson 35</title>
  <style>
    body {
      font-family: 'Fredoka', 'Comic Sans MS', sans-serif;
      background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      color: #333;
    }

    .container {
      background: #ffffff;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 600px;
      width: 90%;
    }

    h1 {
      margin: 0;
      color: #3f2b96;
      font-size: 32px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    .subtitle {
      color: #666;
      font-size: 18px;
      margin-top: 5px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .status-bar {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
      padding: 12px;
      border-radius: 12px;
      background-color: #f0f3f8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .turn-indicator {
      display: inline-block;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      background: #2575fc;
      padding: 18px;
      border-radius: 18px;
      box-shadow: inset 0 5px 10px rgba(0,0,0,0.2);
    }

    .cell {
      background: #ffffff;
      border-radius: 50%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      color: #2c3e50;
      cursor: pointer;
      user-select: none;
      box-shadow: inset 0 4px 6px rgba(0,0,0,0.15), 0 3px 6px rgba(0,0,0,0.1);
      transition: transform 0.15s ease, background-color 0.3s;
    }

    .cell:hover {
      transform: scale(1.06);
      background-color: #f8f9fa;
    }

    .cell.player1 {
      background: #ffcc00;
      color: #000;
      box-shadow: inset 0 -4px 6px rgba(0,0,0,0.2);
      cursor: default;
    }

    .cell.player2 {
      background: #ff4757;
      color: #fff;
      box-shadow: inset 0 -4px 6px rgba(0,0,0,0.2);
      cursor: default;
    }

    .controls {
      margin-top: 25px;
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    button {
      background: #2575fc;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(37, 117, 252, 0.3);
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #1a5bb8;
      transform: translateY(-2px);
    }

    select {
      padding: 10px;
      font-size: 16px;
      border-radius: 10px;
      border: 2px solid #2575fc;
      outline: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🟡 Connect Four 🔴</h1>
  <div class="subtitle">UFLI Foundations — Short 'a' Words</div>

  <div class="status-bar">
    <div>
      <span id="indicator" class="turn-indicator" style="background: #ffcc00;"></span>
      <span id="turn-text">Player 1's Turn (Yellow)</span>
    </div>
    <select id="board-select" onchange="loadBoard(this.value)">
      <option value="0">Board 1</option>
      <option value="1">Board 2</option>
      <option value="2">Board 3</option>
      <option value="3">Board 4</option>
      <option value="4">Board 5</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>

  <div class="controls">
    <button onclick="resetGame()">🔄 Reset Board</button>
  </div>
</div>

<script>
  const boards = [
    // Board 1
    ["rap", "tad", "pat", "van", "ban", "fat", "drag", "tact", "glad", "jam", "tap", "mast", "lag", "rat", "scab", "ran", "rasp", "yap", "blab", "brag", "can", "mad", "vast", "swam", "slab"],
    // Board 2
    ["fat", "scan", "at", "nab", "an", "tram", "grab", "tax", "yam", "hand", "lap", "rat", "band", "has", "vast", "mat", "tap", "pan", "sag", "ham", "flap", "clap", "task", "jab", "span"],
    // Board 3
    ["nap", "an", "van", "max", "swam", "tad", "sap", "cap", "ax", "gasp", "sat", "drab", "sand", "has", "had", "bag", "map", "gap", "cab", "yap", "fast", "last", "damp", "mad", "blab"],
    // Board 4
    ["cram", "cast", "tact", "vat", "scan", "nab", "tap", "ax", "cap", "gag", "fact", "damp", "band", "mast", "drab", "lab", "sag", "yap", "nag", "bag", "slam", "has", "crab", "pant", "tab"],
    // Board 5
    ["drab", "flat", "scam", "rap", "cap", "sat", "lag", "ramp", "blab", "pan", "pant", "sap", "mask", "map", "raft", "fan", "tap", "grab", "fast", "damp", "brag", "gas", "land", "has", "as"]
  ];

  let currentBoardIndex = 0;
  let currentPlayer = 1; // 1 = Yellow, 2 = Red
  let boardState = Array(25).fill(0);
  let gameOver = false;

  function loadBoard(index) {
    currentBoardIndex = index;
    resetGame();
  }

  function resetGame() {
    boardState = Array(25).fill(0);
    currentPlayer = 1;
    gameOver = false;
    updateStatus();
    renderGrid();
  }

  function updateStatus() {
    const indicator = document.getElementById('indicator');
    const turnText = document.getElementById('turn-text');
    if (gameOver) return;

    if (currentPlayer === 1) {
      indicator.style.background = '#ffcc00';
      turnText.innerText = "Player 1's Turn (Yellow)";
    } else {
      indicator.style.background = '#ff4757';
      turnText.innerText = "Player 2's Turn (Red)";
    }
  }

  function renderGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const words = boards[currentBoardIndex];

    words.forEach((word, index) => {
      const cell = document.createElement('div');
      cell.classList.add('cell');
      cell.innerText = word;

      if (boardState[index] === 1) cell.classList.add('player1');
      if (boardState[index] === 2) cell.classList.add('player2');

      cell.onclick = () => handleCellClick(index, word);
      grid.appendChild(cell);
    });
  }

  function handleCellClick(index, word) {
    if (boardState[index] !== 0 || gameOver) return;

    // Prompt student to read word
    const playerColor = currentPlayer === 1 ? 'Yellow' : 'Red';
    setTimeout(() => {
      const confirmed = confirm(`Player ${currentPlayer} (${playerColor}): Read the word "${word.toUpperCase()}" out loud! Did you read it correctly?`);
      if (confirmed) {
        boardState[index] = currentPlayer;
        if (checkWin(currentPlayer)) {
          gameOver = true;
          alert(`🎉 Player ${currentPlayer} (${playerColor}) gets 4 IN A ROW and WINS! 🎉`);
          document.getElementById('turn-text').innerText = `🏆 Player ${currentPlayer} Wins!`;
        } else {
          currentPlayer = currentPlayer === 1 ? 2 : 1;
          updateStatus();
        }
        renderGrid();
      }
    }, 50);
  }

  function checkWin(player) {
    // 5x5 grid winning lines (4 in a row)
    const winningPatterns = [
      // Horizontal
      [0,1,2,3], [1,2,3,4],
      [5,6,7,8], [6,7,8,9],
      [10,11,12,13], [11,12,13,14],
      [15,16,17,18], [16,17,18,19],
      [20,21,22,23], [21,22,23,24],
      // Vertical
      [0,5,10,15], [5,10,15,20],
      [1,6,11,16], [6,11,16,21],
      [2,7,12,17], [7,12,17,22],
      [3,8,13,18], [8,13,18,23],
      [4,9,14,19], [9,14,19,24],
      // Diagonal (down-right)
      [0,6,12,18], [1,7,13,19], [5,11,17,23], [6,12,18,24],
      // Diagonal (up-right)
      [15,11,7,3], [16,12,8,4], [20,16,12,8], [21,17,13,9]
    ];

    return winningPatterns.some(pattern => 
      pattern.every(index => boardState[index] === player)
    );
  }

  // Initial setup
  renderGrid();
</script>

</body>
</html>
